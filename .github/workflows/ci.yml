# A caller that PASSES a secret and READS an output.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      python-version: "3.12"
    secrets:                   # NEW: name each secret you pass (this is safer than "secrets: inherit",
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}     # which passes ALL of them)

  report:
    needs: checks              # wait for the called workflow to finish
    runs-on: ubuntu-24.04
    steps:
      # NEW: read an output of the called workflow: needs.<job>.outputs.<name>
      - run: echo "The checks ran with ${{ needs.checks.outputs.python-used }}"
